# The minimum Nocturne needs to run the compatibility tests. Data is on tmpfs, so every restart starts clean.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: nocturne
    tmpfs:
    - /var/lib/postgresql/data
    configs:
    - source: init-roles
      target: /docker-entrypoint-initdb.d/00-init-roles.sql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -p 5432
      interval: 2s
      retries: 30

  nocturne-api:
    image: ghcr.io/nightscout/nocturne/nocturne-api:latest
    environment:
      INSTANCE_KEY: compatibility-test-instance-key-0123456789
      BASE_DOMAIN: nocturne.localhost
      ConnectionStrings__nocturne-postgres: Host=postgres;Database=nocturne;Username=nocturne_app;Password=app_password
      ConnectionStrings__nocturne-postgres-migrator: Host=postgres;Database=nocturne;Username=nocturne_migrator;Password=migrator_password
      # lets requests/nocturne.http seed a tenant and get an owner session
      NOCTURNE_ENABLE_DEV_ONLY_ENDPOINTS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # Proxies /api to nocturne-api and serves socket.io
  nocturne-web:
    image: ghcr.io/nightscout/nocturne/nocturne-web:latest
    environment:
      NOCTURNE_API_URL: http://nocturne-api:8080
      INSTANCE_KEY: compatibility-test-instance-key-0123456789
      BASE_DOMAIN: nocturne.localhost
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
    - nocturne-api

  # Only needed because nocturne-web does not serve /pebble
  gateway:
    image: mcr.microsoft.com/dotnet/nightly/yarp:2.3-preview
    entrypoint: ["dotnet", "/app/yarp.dll"]
    environment:
      REVERSEPROXY__ROUTES__pebble__MATCH__PATH: /pebble
      REVERSEPROXY__ROUTES__pebble__CLUSTERID: api
      REVERSEPROXY__ROUTES__pebble__TRANSFORMS__0__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__ROUTES__web__MATCH__PATH: "/{**catchall}"
      REVERSEPROXY__ROUTES__web__CLUSTERID: web
      REVERSEPROXY__ROUTES__web__TRANSFORMS__0__RequestHeaderOriginalHost: "True"
      REVERSEPROXY__CLUSTERS__api__DESTINATIONS__d1__ADDRESS: http://nocturne-api:8080
      REVERSEPROXY__CLUSTERS__web__DESTINATIONS__d1__ADDRESS: http://nocturne-web:5173
    ports:
    - "1612:5000"
    depends_on:
    - nocturne-api
    - nocturne-web

configs:
  # The roles Nocturne expects: nocturne_migrator owns the schema, nocturne_app is the runtime role (not a superuser, so Row Level Security applies)
  init-roles:
    content: |
      CREATE ROLE nocturne_migrator LOGIN PASSWORD 'migrator_password';
      CREATE ROLE nocturne_app LOGIN PASSWORD 'app_password';
      ALTER DATABASE nocturne OWNER TO nocturne_migrator;
      ALTER SCHEMA public OWNER TO nocturne_migrator;
      GRANT CONNECT ON DATABASE nocturne TO nocturne_app;
      GRANT USAGE ON SCHEMA public TO nocturne_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nocturne_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO nocturne_app;
